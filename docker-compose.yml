services:
  backend:
    build: ./backend_machine
    container_name: sewing_backend
    environment:
      SEWINGIOT_DB_SERVER: "${SEWINGIOT_DB_SERVER:-10.5.0.107}"
      SEWINGIOT_DB_NAME: "${SEWINGIOT_DB_NAME:-sewingiot}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_USER: "${DB_USER:-sa}"
      DB_PASSWORD: "${DB_PASSWORD:-Satu1234!}"
      APP_HOST: "0.0.0.0"
      APP_PORT: "5500"
      AI_PROVIDER: "${AI_PROVIDER:-ollama}"
      # Ollama runs on the LAN server, not inside this backend container.
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://10.5.0.101:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2}"
      # Origin yang boleh akses WebSocket/CORS. "*" = semua (tool internal).
      # Bisa dibatasi, contoh: "http://10.5.0.107:5175,http://103.24.148.59:5175"
      APP_ALLOWED_ORIGINS: "${APP_ALLOWED_ORIGINS:-*}"
      # Sync Master IE dari GCC (detail-proses). .env di backend_machine/ TIDAK otomatis masuk container.
      GCC_BASE_URL: "${GCC_BASE_URL:-https://gcc.gistexgarmenindonesia.com}"
      GCC_API_KEY: "${GCC_API_KEY:-332100185}"
      GCC_SMV_PAGE_LIMIT: "${GCC_SMV_PAGE_LIMIT:-50}"
      GCC_SMV_HTTP_TIMEOUT_SEC: "${GCC_SMV_HTTP_TIMEOUT_SEC:-300}"
      GCC_SMV_DATE: "${GCC_SMV_DATE:-}"
    ports:
      - "5500:5500"
    restart: unless-stopped

  frontend:
    build: ./frontend_machine
    container_name: sewing_frontend
    depends_on:
      - backend
    ports:
      - "5175:80"
    restart: unless-stopped
